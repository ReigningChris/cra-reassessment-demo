<!DOCTYPE html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Canada Revenue Agency — Reassessment inquiry</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
    <script charset="utf-8">
      (function () {
        var cfg = window.CRA_DEMO_CONFIG || {};
        if (!cfg.deploymentId) return;
        (function (g, e, n, es, ys) {
          g._genesysJs = e;
          g[e] =
            g[e] ||
            function () {
              (g[e].q = g[e].q || []).push(arguments);
            };
          g[e].t = 1 * new Date();
          g[e].c = es;
          ys = document.createElement("script");
          ys.async = 1;
          ys.src = n;
          ys.charset = "utf-8";
          document.head.appendChild(ys);
        })(window, "Genesys", "https://apps.mypurecloud.com/genesys-bootstrap/genesys.min.js", {
          environment: cfg.environment || "prod",
          deploymentId: cfg.deploymentId,
          debug: !!cfg.debug,
        });
      })();
    </script>
  </head>
  <body>
    <header class="banner">
      <div class="banner-flag">
        <img src="canada-flag.svg" alt="Flag of Canada" width="56" height="28" />
      </div>
      <div class="banner-text">
        <div class="banner-mark">Canada Revenue Agency</div>
        <div class="banner-sub">Reassessment inquiry</div>
      </div>
    </header>

    <main>
      <div class="card">
        <h1>Review your information</h1>
        <p class="lead">
          Please review the details from your reassessment intake form below. When you are ready,
          start a secure chat with a CRA virtual assistant.
        </p>

        <form id="intake-form" aria-label="CRA reassessment intake review">
          <fieldset>
            <legend>Your submitted details</legend>

            <div class="field">
              <label for="citizen_name">Name</label>
              <input id="citizen_name" name="citizen_name" type="text" readonly />
            </div>

            <div class="field">
              <label for="contact_email">Email</label>
              <input id="contact_email" name="contact_email" type="email" readonly />
            </div>

            <div class="field">
              <label for="issue_category">Issue category</label>
              <input id="issue_category" name="issue_category" type="text" readonly />
            </div>

            <div class="field">
              <label for="form_submission_id">Reference number</label>
              <input id="form_submission_id" name="form_submission_id" type="text" readonly />
            </div>
          </fieldset>

          <div class="actions">
            <button type="button" class="btn-primary" id="start-chat" disabled>
              Start chat with CRA Assistant
            </button>
          </div>

          <div id="status" class="status" role="status" aria-live="polite"></div>
        </form>
      </div>
    </main>

    <footer>Canada Revenue Agency</footer>

    <script>
      (function () {
        const cfg = window.CRA_DEMO_CONFIG || {};
        const ctx = cfg.startContext || {};
        const statusEl = document.getElementById("status");
        const startBtn = document.getElementById("start-chat");
        let messengerInitialized = false;

        function showStatus(message, type) {
          statusEl.textContent = message;
          statusEl.className = "status visible " + type;
        }

        function customAttributes() {
          return {
            citizen_name: ctx.citizen_name,
            contact_email: ctx.contact_email,
            issue_category: ctx.issue_category,
            form_submission_id: ctx.form_submission_id,
          };
        }

        function formatError(error) {
          if (!error) return "Unknown error";
          if (typeof error === "string") return error;
          return error.message || error.reason || JSON.stringify(error);
        }

        Object.keys(ctx).forEach(function (key) {
          const el = document.getElementById(key);
          if (el) el.value = ctx[key];
        });

        if (!cfg.deploymentId) {
          showStatus("Chat is temporarily unavailable. Please try again later.", "error");
          return;
        }

        function enableChatReady() {
          if (messengerInitialized) return;
          messengerInitialized = true;
          startBtn.disabled = false;
          showStatus("Secure chat is ready. Click the button above to begin.", "info");
        }

        function logReady(name) {
          console.log("[CRA demo] Genesys event:", name);
        }

        Genesys("subscribe", "Launcher.ready", function () {
          logReady("Launcher.ready");
          enableChatReady();
        });
        Genesys("subscribe", "Messenger.ready", function () {
          logReady("Messenger.ready");
          enableChatReady();
        });
        Genesys("subscribe", "Database.ready", function () {
          logReady("Database.ready");
          Genesys("command", "Database.set", {
            messaging: { customAttributes: customAttributes() },
          });
        });
        Genesys("subscribe", "Messenger.opened", function () {
          logReady("Messenger.opened");
          showStatus("Your chat session is open.", "info");
          startBtn.disabled = false;
        });

        window.setTimeout(function () {
          if (!messengerInitialized) {
            showStatus(
              "Messenger did not initialize. Check deployment Allowed Domains (allow all or add reigningchris.github.io), then republish.",
              "error"
            );
          }
        }, 15000);

        function startChat() {
          if (!messengerInitialized) {
            showStatus("Messenger is still loading. Wait a few seconds and try again.", "error");
            return;
          }

          startBtn.disabled = true;
          showStatus("Starting secure chat…", "info");

          Genesys(
            "command",
            "Database.set",
            { messaging: { customAttributes: customAttributes() } },
            function () {
              Genesys(
                "command",
                "Messenger.open",
                {},
                function () {},
                function (error) {
                  console.error("Messenger.open rejected:", error);
                  showStatus("Could not open chat: " + formatError(error), "error");
                  startBtn.disabled = false;
                }
              );
            },
            function (error) {
              console.error("Database.set rejected:", error);
              showStatus("Could not prepare chat: " + formatError(error), "error");
              startBtn.disabled = false;
            }
          );
        }

        startBtn.addEventListener("click", startChat);
      })();
    </script>
  </body>
</html>

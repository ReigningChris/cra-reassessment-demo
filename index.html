<!DOCTYPE html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Canada Revenue Agency — Reassessment inquiry</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
  </head>
  <body>
    <header class="banner">
      <div class="banner-flag">
        <img src="canada-flag.svg" alt="Flag of Canada" width="56" height="28" />
      </div>
      <div class="banner-text">
        <div class="banner-mark">Canada Revenue Agency</div>
        <div class="banner-sub">Reassessment inquiry</div>
      </div>
    </header>

    <main>
      <div class="card">
        <h1>Review your information</h1>
        <p class="lead">
          Please review the details from your reassessment intake form below. When you are ready,
          start a secure chat with a CRA virtual assistant.
        </p>

        <form id="intake-form" aria-label="CRA reassessment intake review">
          <fieldset>
            <legend>Your submitted details</legend>

            <div class="field">
              <label for="citizen_name">Name</label>
              <input id="citizen_name" name="citizen_name" type="text" readonly />
            </div>

            <div class="field">
              <label for="contact_email">Email</label>
              <input id="contact_email" name="contact_email" type="email" readonly />
            </div>

            <div class="field">
              <label for="issue_category">Issue category</label>
              <input id="issue_category" name="issue_category" type="text" readonly />
            </div>

            <div class="field">
              <label for="form_submission_id">Reference number</label>
              <input id="form_submission_id" name="form_submission_id" type="text" readonly />
            </div>
          </fieldset>

          <div class="actions">
            <button type="button" class="btn-primary" id="start-chat" disabled>
              Start chat with CRA Assistant
            </button>
          </div>

          <div id="status" class="status" role="status" aria-live="polite"></div>
        </form>
      </div>
    </main>

    <footer>Canada Revenue Agency</footer>

    <script>
      (function () {
        const cfg = window.CRA_DEMO_CONFIG || {};
        const ctx = cfg.startContext || {};
        const statusEl = document.getElementById("status");
        const startBtn = document.getElementById("start-chat");
        let messengerReady = false;
        let databaseReady = false;

        function showStatus(message, type) {
          statusEl.textContent = message;
          statusEl.className = "status visible " + type;
        }

        function customAttributes() {
          return {
            citizen_name: ctx.citizen_name,
            contact_email: ctx.contact_email,
            issue_category: ctx.issue_category,
            form_submission_id: ctx.form_submission_id,
          };
        }

        Object.keys(ctx).forEach(function (key) {
          const el = document.getElementById(key);
          if (el) el.value = ctx[key];
        });

        if (!cfg.deploymentId) {
          showStatus("Chat is temporarily unavailable. Please try again later.", "error");
          return;
        }

        function markMessengerReady() {
          if (messengerReady) return;
          messengerReady = true;
          startBtn.disabled = false;
          showStatus("Secure chat is ready. Click the button above to begin.", "info");
        }

        function markDatabaseReady() {
          databaseReady = true;
        }

        function setCustomAttributes(onSuccess, onError) {
          Genesys(
            "command",
            "Database.set",
            { messaging: { customAttributes: customAttributes() } },
            onSuccess,
            onError
          );
        }

        function openMessenger() {
          Genesys(
            "command",
            "Messenger.open",
            {},
            function () {
              showStatus("Opening secure chat…", "info");
            },
            function (error) {
              const msg =
                (error && (error.message || error.reason || error.toString())) ||
                "Unable to open chat.";
              console.error("Messenger.open rejected:", error);
              showStatus(msg + " Check Messenger config: UI enabled, Messaging channel on.", "error");
            }
          );
        }

        function startChat() {
          if (!messengerReady) {
            showStatus("Chat is still loading. Please wait a moment and try again.", "error");
            return;
          }

          startBtn.disabled = true;

          function afterAttributesSet() {
            openMessenger();
            startBtn.disabled = false;
          }

          function onAttributeError(error) {
            console.error("Database.set rejected:", error);
            showStatus("Unable to prepare chat session. Please try again.", "error");
            startBtn.disabled = false;
          }

          if (databaseReady) {
            setCustomAttributes(afterAttributesSet, onAttributeError);
          } else {
            Genesys("subscribe", "Database.ready", function () {
              markDatabaseReady();
              setCustomAttributes(afterAttributesSet, onAttributeError);
            });
          }
        }

        (function loadGenesysBootstrap() {
          var g = window;
          var e = "Genesys";
          var n = "https://apps.mypurecloud.com/genesys-bootstrap/genesys.min.js";
          var es = { environment: cfg.environment || "prod", deploymentId: cfg.deploymentId };
          g._genesysJs = e;
          g[e] =
            g[e] ||
            function () {
              (g[e].q = g[e].q || []).push(arguments);
            };
          g[e].t = 1 * new Date();
          g[e].c = es;

          Genesys("subscribe", "Database.ready", markDatabaseReady);
          Genesys("subscribe", "Launcher.ready", markMessengerReady);
          Genesys("subscribe", "Messenger.ready", markMessengerReady);
          Genesys("subscribe", "Messenger.opened", function () {
            showStatus("Your chat session is open.", "info");
          });

          var ys = document.createElement("script");
          ys.async = 1;
          ys.src = n;
          ys.charset = "utf-8";
          ys.onload = function () {
            window.setTimeout(function () {
              if (!messengerReady) {
                showStatus(
                  "Chat is taking longer than expected to load. Try refreshing the page.",
                  "error"
                );
              }
            }, 15000);
          };
          ys.onerror = function () {
            showStatus("Unable to load chat services. Please refresh the page or try again later.", "error");
          };
          document.head.appendChild(ys);
        })();

        startBtn.addEventListener("click", startChat);
      })();
    </script>
  </body>
</html>
